name: Build Facebook posts

# Rebuilds social/posts.json + posters from the CURRENT deals_cache.json.
# No fare scan, so it runs in about a minute. Use after changing the poster design
# or photos; the full refresh also does this at the end of every scan.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright pillow requests
          playwright install --with-deps chromium
      - name: Build posts
        run: python social/generate_posts.py
      - name: Commit
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add social/posts.json social/out social/card social/p social/assets/cities
          git commit -m "Rebuild Facebook posts" || echo "No changes"
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git push origin HEAD:main
