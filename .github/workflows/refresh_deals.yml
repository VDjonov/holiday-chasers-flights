name: Refresh flight deals

# Scans real return fares (per person) via FlightAPI.io and commits
# deals_cache.json back to the repo. GitHub Pages serves the result.

on:
  schedule:
    # Every 3 days (calendar days 1,4,...,28) at 05:00 UTC.
    # (8+10 boards) × 30 destinations × 2 airports × 2 credits × 10 runs
    # = 21,600 credits/month — comfortably inside the FlightAPI Lite plan
    # (30,000), leaving ~5,400 buffer + ~3,000 reserved for live search.
    - cron: "0 5 1,4,7,10,13,16,19,22,25,28 * *"
  workflow_dispatch:

jobs:
  # Skip a SCHEDULED run if the deals were already refreshed in the last 36 hours
  # (e.g. after a manual run). Manual runs (workflow_dispatch) always go ahead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            upd=$(python3 -c "import json;print(json.load(open('deals_cache.json'))['updated_utc'])")
            age=$(( $(date +%s) - $(date -d "$upd" +%s) ))
            echo "deals_cache.json updated $upd (${age}s ago)"
            if [ "$age" -lt 129600 ]; then skip=true; echo "Fresh enough: skipping this scheduled scan"; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # One job per departure airport, in parallel: each takes ~half the time of the old
  # single job, and a failure in one can no longer throw away the other's fresh fares.
  scan:
    needs: gate
    if: ${{ needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        airport: [ORK, DUB]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Scan ${{ matrix.airport }}
        env:
          SCAN_AIRPORTS: ${{ matrix.airport }}
          PART_OUT: part_${{ matrix.airport }}.json
          FLIGHTAPI_KEY: ${{ secrets.FLIGHTAPI_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_KEY2: ${{ secrets.SERPAPI_KEY2 }}
          SERPAPI_KEY3: ${{ secrets.SERPAPI_KEY3 }}
          SERPAPI_KEY4: ${{ secrets.SERPAPI_KEY4 }}
          SERPAPI_KEY5: ${{ secrets.SERPAPI_KEY5 }}
        run: python refresh_deals.py

      - name: Upload scan part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.airport }}
          path: part_${{ matrix.airport }}.json
          if-no-files-found: warn

  finalize:
    needs: [gate, scan]
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download scan parts
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true

      - name: Merge parts into deals_cache.json
        run: pip install requests && python merge_parts.py parts

      - name: Generate SEO destination pages + sitemap
        run: python generate_pages.py

      - name: Build Facebook posts (posters + captions) from the fresh deals
        # Best-effort: a poster-rendering problem must never block the deal refresh.
        continue-on-error: true
        run: |
          pip install playwright pillow requests
          playwright install --with-deps chromium
          python social/generate_posts.py

      - name: Commit the updated cache
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add deals_cache.json price_history.json destinations sitemap.xml social/posts.json social/out social/card social/p social/assets/cities
          git commit -m "Refresh flight deals (FlightAPI, per-person)" || echo "No changes to commit"
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git push origin HEAD:main
